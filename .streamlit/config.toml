[server]
maxMessageSize = 1000
maxUploadSize = 1000
enableCORS = false
enableXsrfProtection = false
headless = true

[client]
showErrorDetails = false

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[theme]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
